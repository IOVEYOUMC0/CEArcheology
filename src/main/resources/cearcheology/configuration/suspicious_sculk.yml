items:
  cearcheology:suspicious_sculk:
    data:
      item-name: "<!i><dark_aqua><lang:item.cearcheology.suspicious_sculk>"
      lore:
        - "<!i><gray><lang:item.cearcheology.brush_hint>"
    model: cearcheology:block/suspicious_sculk_0
    behavior:
      - type: block_item
        block:
          settings:
            template:
              - default:sound/stone
            overrides:
              hardness: 0.1
              resistance: 0.2
              luminance: 1
            tags:
              - minecraft:mineable/hoe
          behaviors:
            - type: cearcheology:brushable_block
              max-progress: 4
              brush-time: 96
              required-brush-level: 1
              loot-table: cearcheology:default
              result-block: minecraft:sculk
              drop-block: minecraft:sculk
              experience: 0
              break-experience: 1
          loot:
            template: default:loot_table/self
          states:
            properties:
              brush_progress:
                type: int
                range: 0~4
                default: 0
            appearances:
              progress_0:
                auto-state: solid
                model: cearcheology:block/suspicious_sculk_0
              progress_1:
                auto-state: solid
                model: cearcheology:block/suspicious_sculk_1
              progress_2:
                auto-state: solid
                model: cearcheology:block/suspicious_sculk_2
              progress_3:
                auto-state: solid
                model: cearcheology:block/suspicious_sculk_3
              progress_4:
                auto-state: solid
                model: cearcheology:block/suspicious_sculk_3
            # Hardness decreases with brush progress. Set all states to the same value for a
            # single hardness.
            variants:
              brush_progress=0:
                appearance: progress_0
                settings:
                  hardness: 0.1
              brush_progress=1:
                appearance: progress_1
                settings:
                  hardness: 0.09
              brush_progress=2:
                appearance: progress_2
                settings:
                  hardness: 0.08
              brush_progress=3:
                appearance: progress_3
                settings:
                  hardness: 0.07
              brush_progress=4:
                appearance: progress_4
                settings:
                  hardness: 0.06
