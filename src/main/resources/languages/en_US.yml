# CEArcheology English (US) language file
# Placeholder syntax is {name}; color codes use &.

prefix: "&6[CEArcheology] &r"

# Help
help-header: "&6========== CEArcheology Help =========="
help-footer: "&6======================================"
help-help: "&e/cearch help &7- Show help"
help-reload: "&e/cearch reload &7- Reload config, tools, loot and runtime state"
help-give-block: "&e/cearch give block <blockId> [player] [amount] &7- Give an archaeology block"
help-give-block-craftengine: "&e/cearch give block <blockId> craftengine <ceItemId> [player] [amount] &7- Preset a CraftEngine reward"
help-give-block-table: "&e/cearch give block <blockId> table <lootTableId> [player] [amount] &7- Preset a loot table"
help-give-block-item: "&e/cearch give block <blockId> item <itemId> [player] [amount] &7- Preset a vanilla item"
help-give-tool: "&e/cearch give tool <toolId> [player] [amount] &7- Give a brushing tool"
help-place: "&e/cearch place <blockId> [x y z|world x y z] [itemId/lootTableId] &7- Place an archaeology block"
help-place-note: "&7Note: players may omit world, the console must specify it; place auto-detects vanilla item IDs and existing loot table IDs."

# Reload
reloaded: "&aCEArcheology reloaded."
reload-summary-tools: "&7Tool configs: &f{count}"
